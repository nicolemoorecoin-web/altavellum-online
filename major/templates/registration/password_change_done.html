{% extends "base.html" %}
{% load static %}

{% block title %}Password changed{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 640px;">
  <div class="alert alert-success mb-4">Your password has been updated.</div>

  <div class="card shadow-sm">
    <div class="card-body p-4 p-md-5 text-center">
      <h1 class="h4 fw-semibold mb-2">Password changed</h1>
      <p class="text-muted mb-4">You can continue using your account with the new password.</p>
      <a href="{% url 'user-home' %}" class="btn btn-primary">Back to dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
