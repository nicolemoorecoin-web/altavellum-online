{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Altavellum — {% block title %}{% endblock %}</title>

  <!-- Bootstrap CDN so there's always some styling -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Soft UI (local static) -->
  <link rel="stylesheet" href="{% static 'assets/css/nucleo-icons.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/nucleo-svg.css' %}">
  <link id="pagestyle" rel="stylesheet" href="{% static 'assets/css/soft-ui-dashboard.css' %}">

  {% block stylesheets %}{% endblock %}
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/">ALTAVELLUM</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topnav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="topnav" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/accounts/login/">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="/accounts/register/">Sign up</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <!-- JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'assets/js/soft-ui-dashboard.min.js' %}"></script>
  {% block javascripts %}{% endblock %}
</body>
</html>
